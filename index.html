<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakfast Selection</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="scripts.js"></script>
</head>
<body background="image/download.jpg">
    <div class="container">
        <h1>Select Your Breakfast</h1>
        <p>Choose your preferred breakfast option from the list below.</p>
        <form id="breakfastForm">
            <label>
                <input type="radio" name="breakfast" value="Eggs">Eggs
            </label>
            <label>
                <input type="radio" name="breakfast" value="Croissant">Croissant
            </label>
            <label>
                <input type="radio" name="breakfast" value="Pancakes">Pancakes
            </label>
            <label>
                <input type="radio" name="breakfast" value="Porridge">Porridge
            </label>
            <label>
                <input type="radio" name="breakfast" value="Fruit Salad">Fruit Salad
            </label>
        
        </form>
        <button id="confirmButton"> Confirm Selection</button>
            <div id="recipeSteps"></div>
    </div>
    
</body>
</html>
